[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rebranch"
version = "0.1.0"
description = "ReBranch: Counterexample-Guided Failure Branching for Zero-Shot Robotic Manipulation"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6",
    "mujoco>=3.2",
    "Pillow>=10",
    "cma>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["rebranch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
